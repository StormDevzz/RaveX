plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

base {
    archivesName = property("archives_name")
}

def getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return "dev"
    }
}

version = property("mod_version")
group = property("maven_group")

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft(libs.minecraft)
    mappings(loom.officialMojangMappings())
    modImplementation(libs.fabric.loader)

    implementation(libs.discord.ipc)
    include(libs.discord.ipc)
    implementation("net.java.dev.jna:jna:5.17.0")
    include("net.java.dev.jna:jna:5.17.0")
    implementation("net.java.dev.jna:jna-platform:5.17.0")
    include("net.java.dev.jna:jna-platform:5.17.0")

    modCompileOnly(files("libs/sodium-fabric-0.8.13+mc1.21.11-fixed.jar"))

    compileOnly('org.jetbrains:annotations:26.0.2')
}

loom {
    accessWidenerPath = file("src/main/resources/ravex.accesswidener")

    mixin {
        defaultRefmapName = "ravex.refmap.json"
    }

    runs {
        client {
            client()
            configName = "Client"
            ideConfigGenerated(true)
            vmArgs(
                "-Dcom.mojang.text2speech.Narrator=false",
                "-Xmx1280M",
                "-Xms512M",
                "-XX:+UseG1GC",
                "-XX:MaxGCPauseMillis=20",
                "-XX:InitiatingHeapOccupancyPercent=45",
                "-XX:G1ReservePercent=15",
                "-XX:ReservedCodeCacheSize=256M",
                "-XX:MaxMetaspaceSize=256M",
                "-XX:CICompilerCount=2",
                "-XX:CompressedClassSpaceSize=128M",
                "-XX:MaxDirectMemorySize=512M"
            )
        }
    }
}





task runLoader(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ravex.loader.RaveXLoader'
    workingDir = rootProject.projectDir
}

// нативная CMake-сборка: ./gradlew build соберёт dll/so и java-мод

def nativesDir = file("src/main/resources/assets/ravex/natives")
def nativeBuildDir = file("build/native")

task buildNatives {
    description 'Build native C++ libraries via CMake (skipped if CMake or compiler is not available)'
    doLast {
        def cmakeAvailable = false
        try {
            def pb = new ProcessBuilder(["cmake", "--version"])
            pb.redirectOutput(ProcessBuilder.Redirect.PIPE)
            pb.redirectError(ProcessBuilder.Redirect.PIPE)
            def proc = pb.start()
            proc.waitFor()
            cmakeAvailable = proc.exitValue() == 0
        } catch (Throwable t) {
            cmakeAvailable = false
        }

        if (!cmakeAvailable) {
            println "[RaveX] CMake not found, skipping native build. Using committed natives in ${nativesDir.absolutePath}"
            return
        }

        if (!nativeBuildDir.exists()) nativeBuildDir.mkdirs()
        if (!nativesDir.exists()) nativesDir.mkdirs()

        def configArgs = ["cmake", "-S", "src/main/cpp", "-B", "build/native",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DCMAKE_INSTALL_PREFIX=${nativesDir.absolutePath}"]
        // генератор CMake выберет сам

        try {
            println "[RaveX] Configuring native CMake build..."
            exec {
                commandLine configArgs
            }
        } catch (Throwable t) {
            println "[RaveX] CMake configuration failed: ${t.message}. Using committed natives."
            return
        }

        try {
            println "[RaveX] Building native libraries..."
            exec {
                commandLine "cmake", "--build", "build/native", "--config", "Release", "--parallel"
            }
        } catch (Throwable t) {
            println "[RaveX] CMake build failed: ${t.message}. Using committed natives."
            return
        }

        try {
            copy {
                from(nativeBuildDir)
                include("**/*.dll")
                include("**/*.so")
                into(nativesDir)
                eachFile { details ->
                    details.path = details.name
                }
                includeEmptyDirs = false
            }
            println "[RaveX] Native libraries copied to ${nativesDir.absolutePath}"
        } catch (Throwable t) {
            println "[RaveX] Failed to copy native binaries: ${t.message}"
            return
        }

        try {
            exec {
                commandLine "python", "scripts/sync_native_manifest.py"
            }
            println "[RaveX] Native manifest synchronized"
        } catch (Throwable t) {
            println "[RaveX] Failed to synchronize native manifest: ${t.message}"
        }
    }
}

// Нативные библиотеки собираются только при явной команде ./gradlew build.
tasks.named('build') {
    dependsOn buildNatives
}
// Нативка должна быть готова до копирования ресурсов (только в рамках сборки).
tasks.named('processResources') {
    mustRunAfter buildNatives
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude("assets/ravex/companion/textures/**")
    manifest {
        attributes(
            'Main-Class': 'ravex.loader.RaveXLoader'
        )
    }
}

def mcVersion = property("minecraft_version")
def loaderVersion = property("loader_version")

// changelog в игре берётся из .github/RELEASE_NOTES.md, копируется в jar
def changelogNotes = file('.github/RELEASE_NOTES.md')

tasks.register('copyChangelog', Copy) {
    description = 'Bundles .github/RELEASE_NOTES.md into the jar as /ravex/changelog.md'
    group = 'build'
    from(changelogNotes)
    into(layout.buildDirectory.dir('resources/main/ravex'))
    rename { 'changelog.md' }
    onlyIf { changelogNotes.exists() }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn 'copyChangelog'
    inputs.properties([
        "version"          : version,
        "minecraft_version": mcVersion,
        "loader_version"   : loaderVersion
    ])

    filesMatching("fabric.mod.json") {
        expand([
            "version"          : version,
            "minecraft_version": mcVersion,
            "loader_version"   : loaderVersion
        ])
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)

}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(remapSourcesJar) {
                builtBy remapSourcesJar
            }
            pom {
                name = "RaveX-Free"
                description = "RaveX Free utility client"
                url = "https://github.com/StormDevzz/RaveX"
            }
        }
    }

    repositories {
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
    }
}
