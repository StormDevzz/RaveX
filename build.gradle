plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

base {
    archivesName = property("archives_name")
}

def getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return "dev"
    }
}

version = property("mod_version")
group = property("maven_group")

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft(libs.minecraft)
    mappings(loom.officialMojangMappings())
    modImplementation(libs.fabric.loader)

    implementation(libs.discord.ipc)
    include(libs.discord.ipc)
    implementation("org.luaj:luaj-jse:3.0.1")
    include("org.luaj:luaj-jse:3.0.1")

    modCompileOnly(files("libs/sodium-fabric-0.8.13+mc1.21.11-fixed.jar"))

    compileOnly('org.jetbrains:annotations:26.0.2')
}

loom {
    accessWidenerPath = file("src/main/resources/ravex.accesswidener")

    mixin {
        defaultRefmapName = "ravex.refmap.json"
    }

    runs {
        client {
            client()
            configName = "Client"
            ideConfigGenerated(true)
            vmArgs(
                "-Dcom.mojang.text2speech.Narrator=false",
                "-Xmx1280M",
                "-Xms512M",
                "-XX:+UseG1GC",
                "-XX:MaxGCPauseMillis=20",
                "-XX:InitiatingHeapOccupancyPercent=45",
                "-XX:G1ReservePercent=15",
                "-XX:ReservedCodeCacheSize=256M",
                "-XX:MaxMetaspaceSize=256M",
                "-XX:CICompilerCount=2",
                "-XX:CompressedClassSpaceSize=128M",
                "-XX:MaxDirectMemorySize=512M"
            )
        }
    }
}





task runLoader(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ravex.loader.RaveXLoader'
    workingDir = rootProject.projectDir
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude("assets/ravex/companion/textures/**")
    manifest {
        attributes(
            'Main-Class': 'ravex.loader.RaveXLoader'
        )
    }
}

def mcVersion = property("minecraft_version")
def loaderVersion = property("loader_version")

// The in-game changelog is rendered from .github/RELEASE_NOTES.md, the same file that
// feeds the GitHub release body. It is copied into the jar so the changelog also works
// offline, without keeping a second copy of the notes in the resources folder.
def changelogNotes = file('.github/RELEASE_NOTES.md')

tasks.register('copyChangelog', Copy) {
    description = 'Bundles .github/RELEASE_NOTES.md into the jar as /ravex/changelog.md'
    group = 'build'
    from(changelogNotes)
    into(layout.buildDirectory.dir('resources/main/ravex'))
    rename { 'changelog.md' }
    onlyIf { changelogNotes.exists() }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn 'copyChangelog'
    inputs.properties([
        "version"          : version,
        "minecraft_version": mcVersion,
        "loader_version"   : loaderVersion
    ])

    filesMatching("fabric.mod.json") {
        expand([
            "version"          : version,
            "minecraft_version": mcVersion,
            "loader_version"   : loaderVersion
        ])
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)

}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(remapSourcesJar) {
                builtBy remapSourcesJar
            }
            pom {
                name = "RaveX-Free"
                description = "RaveX Free utility client"
                url = "https://github.com/StormDevzz/RaveX"
            }
        }
    }

    repositories {
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
    }
}
